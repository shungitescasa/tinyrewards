{{define "title"}}Log in · {{end}}

{{define "main"}}
<section class="login">
	<h1>Log in</h1>
	{{- if .Twitch}}
	<a href="/account/login/twitch" class="button twitch">Continue with Twitch</a>
	<p class="hint">Only your public Twitch name and ID are read.</p>
	{{- else}}
	<p>Twitch login is not configured on this instance.</p>
	{{- end}}
</section>
{{end}}
