<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>TinyRewards</title>
	<style>
		html,
		body {
			margin: 0;
			background: transparent;
			overflow: hidden;
		}

		#notifications {
			position: fixed;
			top: 8px;
			left: 8px;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 4px;
			font: 14px/1.3 sans-serif;
		}

		#media {
			position: fixed;
			top: 0;
			left: 0;
			pointer-events: none;
		}

		#media iframe {
			display: block;
			width: min(100vw, calc(100vh * 16 / 9));
			height: auto;
			aspect-ratio: 16 / 9;
			border: 0;
		}

		#media img,
		#media video {
			display: block;
			max-width: 100vw;
			max-height: 100vh;
			object-fit: contain;
			object-position: top left;
		}

		#notifications div {
			padding: 4px 8px;
			border-radius: 4px;
			background: rgba(0, 0, 0, 0.7);
			color: #fff;
		}
	</style>
</head>

<body>
	<div id="media"></div>
	<div id="notifications"></div>
	<script>
		(() => {
			const IRC_URL = 'wss://irc-ws.chat.twitch.tv:443';
			const PING_INTERVAL = 60000;
			const MAX_BACKOFF = 30000;
			const MAX_NOTIFICATIONS = 8;
			const READY_HOLD = 3000;
			const EVENTS_TIMEOUT = 75000;
			const MIN_MEDIA_DURATION = 5000;
			const MEDIA_LOAD_TIMEOUT = 15000;
			const CLIP_BUFFER = 2000;
			const AUTOPLAY_GRACE = 3000;
			const YOUTUBE_API = 'https://www.youtube.com/iframe_api';
			const AUDIO_EXTENSIONS = ['mp3', 'ogg', 'oga', 'opus', 'wav', 'flac', 'm4a', 'aac', 'weba'];
			const VIDEO_EXTENSIONS = ['mp4', 'webm', 'mov', 'm4v', 'mkv', 'ogv'];
			const IMAGE_EXTENSIONS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'bmp', 'svg', 'apng'];

			const params = new URLSearchParams(location.search);
			const emoteMode = params.get('emote_mode') === 'every' ? 'every' : 'once';
			const delay = Math.max(0, Number(params.get('delay')) || 0);

			const path = location.pathname.replace(/\/+$/, '');
			const userId = path.slice(path.lastIndexOf('/') + 1);
			const root = path.slice(0, path.lastIndexOf('/widget/'));

			const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
			const backoff = attempt => Math.min(MAX_BACKOFF, 1000 * 2 ** attempt);
			const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

			const notifications = document.getElementById('notifications');
			let notificationsEnabled = true;

			function notify(text) {
				if (!notificationsEnabled) return;
				const item = document.createElement('div');
				item.textContent = text;
				notifications.append(item);
				while (notifications.childElementCount > MAX_NOTIFICATIONS) {
					notifications.firstElementChild.remove();
				}
			}

			function ready() {
				notify('Ready');
				notificationsEnabled = false;
				setTimeout(() => notifications.remove(), READY_HOLD);
			}

			async function api(endpoint, what) {
				for (let attempt = 0; ; attempt++) {
					try {
						const res = await fetch(root + endpoint, { cache: 'no-store', headers: { Accept: 'application/json' } });
						const body = await res.json();
						if (!res.ok) throw new Error(body.message || res.statusText);
						return body.data;
					} catch (err) {
						console.error(endpoint, err);
						const wait = backoff(attempt);
						notify('Failed to load ' + what + ', retrying in ' + wait / 1000 + 's');
						await sleep(wait);
					}
				}
			}

			const players = new Map();
			const loading = [];
			const probe = document.createElement('audio');

			function preload(audio) {
				return new Promise(resolve => {
					if (audio.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) return resolve(true);
					audio.addEventListener('canplaythrough', () => resolve(true), { once: true });
					audio.addEventListener('error', () => resolve(false), { once: true });
				});
			}

			function player(files) {
				const file = files.find(f => probe.canPlayType(f.mime)) || files[0];
				if (!file) return null;
				if (!players.has(file.url)) {
					const audio = new Audio(file.url);
					audio.preload = 'auto';
					loading.push(preload(audio));
					audio.load();
					players.set(file.url, audio);
				}
				return players.get(file.url);
			}

			const stage = document.getElementById('media');

			function mediaKind(url, mime) {
				const type = String(mime || '').toLowerCase().split('/')[0];
				if (type === 'audio') return ['audio'];
				if (type === 'video') return ['video'];
				if (type === 'image') return ['img'];
				let ext = '';
				try {
					const name = new URL(url).pathname;
					ext = name.slice(name.lastIndexOf('.') + 1).toLowerCase();
				} catch (err) {
					console.error('invalid media url', url, err);
				}
				if (AUDIO_EXTENSIONS.includes(ext)) return ['audio'];
				if (VIDEO_EXTENSIONS.includes(ext)) return ['video'];
				if (IMAGE_EXTENSIONS.includes(ext)) return ['img'];
				return ['video', 'img'];
			}

			function show(tag, url) {
				return new Promise(resolve => {
					const element = document.createElement(tag);
					element.referrerPolicy = 'no-referrer';
					let loaded = false;
					let startedAt = 0;
					let finished = false;
					const finish = ok => {
						if (finished) return;
						finished = true;
						clearTimeout(timeout);
						element.remove();
						resolve(ok);
					};
					const timeout = setTimeout(() => finish(loaded), MEDIA_LOAD_TIMEOUT);
					const started = () => {
						loaded = true;
						startedAt = Date.now();
						clearTimeout(timeout);
					};
					const settle = () => {
						if (!loaded) return finish(false);
						setTimeout(() => finish(true), Math.max(0, startedAt + MIN_MEDIA_DURATION - Date.now()));
					};

					if (tag === 'img') {
						element.addEventListener('load', () => {
							started();
							settle();
						}, { once: true });
						element.addEventListener('error', () => finish(false), { once: true });
						element.src = url;
						stage.append(element);
						return;
					}

					element.autoplay = true;
					element.playsInline = true;
					element.addEventListener('playing', started, { once: true });
					element.addEventListener('ended', settle, { once: true });
					element.addEventListener('error', settle, { once: true });
					element.src = url;
					stage.append(element);
					const start = () => element.play().catch(err => {
						if (err.name === 'NotAllowedError' && !element.muted) {
							console.warn('autoplay with sound is blocked, playing muted', url);
							element.muted = true;
							return start();
						}
						if (err.name === 'AbortError') return;
						console.error('media playback', url, err);
						settle();
					});
					start();
				});
			}

			async function playMedia({ url, mime }) {
				for (const tag of mediaKind(url, mime)) {
					if (await show(tag, url)) return;
				}
				console.error('unsupported media', url);
			}

			function showClip(clip) {
				return new Promise(resolve => {
					let src;
					try {
						src = new URL(clip.embed_url);
					} catch (err) {
						console.error('invalid clip', clip, err);
						return resolve();
					}
					src.searchParams.set('parent', location.hostname);
					src.searchParams.set('autoplay', 'true');
					src.searchParams.set('muted', 'false');

					const frame = document.createElement('iframe');
					frame.allow = 'autoplay; fullscreen';
					frame.title = clip.title || 'Twitch clip';
					let finished = false;
					const finish = () => {
						if (finished) return;
						finished = true;
						clearTimeout(timeout);
						frame.remove();
						resolve();
					};
					const timeout = setTimeout(finish, MEDIA_LOAD_TIMEOUT);
					frame.addEventListener('load', () => {
						clearTimeout(timeout);
						const length = Math.max(MIN_MEDIA_DURATION, (Number(clip.duration) || 0) * 1000 + CLIP_BUFFER);
						setTimeout(finish, length);
					}, { once: true });
					frame.src = src.toString();
					stage.append(frame);
				});
			}

			let youtubeAPI = null;

			function loadYouTube() {
				if (!youtubeAPI) {
					youtubeAPI = new Promise((resolve, reject) => {
						if (window.YT && window.YT.Player) return resolve(window.YT);
						const previous = window.onYouTubeIframeAPIReady;
						window.onYouTubeIframeAPIReady = () => {
							if (previous) previous();
							resolve(window.YT);
						};
						const script = document.createElement('script');
						script.src = YOUTUBE_API;
						script.onerror = () => {
							youtubeAPI = null;
							script.remove();
							reject(new Error('failed to load the YouTube player'));
						};
						document.head.append(script);
					});
				}
				return youtubeAPI;
			}

			async function showYouTube(video) {
				let YT;
				try {
					YT = await loadYouTube();
				} catch (err) {
					console.error(err);
					return;
				}
				return new Promise(resolve => {
					const container = document.createElement('div');
					const holder = document.createElement('div');
					container.append(holder);
					stage.append(container);

					let player = null;
					let startedAt = 0;
					let finished = false;
					let mutedRetry;
					const finish = () => {
						if (finished) return;
						finished = true;
						clearTimeout(timeout);
						clearTimeout(mutedRetry);
						try {
							if (player) player.destroy();
						} catch (err) {
							console.error('youtube destroy', err);
						}
						container.remove();
						resolve();
					};
					const settle = () => {
						if (!startedAt) return finish();
						setTimeout(finish, Math.max(0, startedAt + MIN_MEDIA_DURATION - Date.now()));
					};
					const timeout = setTimeout(finish, MEDIA_LOAD_TIMEOUT);

					player = new YT.Player(holder, {
						videoId: video.id,
						playerVars: {
							autoplay: 1,
							start: Math.max(0, Number(video.start) || 0),
							playsinline: 1,
							controls: 0,
							disablekb: 1,
							rel: 0,
							iv_load_policy: 3,
							origin: location.origin,
						},
						events: {
							onReady: event => {
								event.target.unMute();
								event.target.setVolume(100);
								event.target.playVideo();
								mutedRetry = setTimeout(() => {
									if (startedAt || finished) return;
									console.warn('autoplay with sound is blocked, playing muted', video.id);
									event.target.mute();
									event.target.playVideo();
								}, AUTOPLAY_GRACE);
							},
							onStateChange: event => {
								if (event.data === YT.PlayerState.PLAYING && !startedAt) {
									startedAt = Date.now();
									clearTimeout(timeout);
									clearTimeout(mutedRetry);
								} else if (event.data === YT.PlayerState.ENDED) {
									settle();
								}
							},
							onError: event => {
								console.error('youtube playback', video.id, event.data);
								settle();
							},
						},
					});
				});
			}

			function showVisual(item) {
				if (item.youtube) return showYouTube(item.youtube);
				if (item.media) return playMedia(item.media);
				if (item.clip) return showClip(item.clip);
				return Promise.resolve();
			}

			function playSound(audio) {
				return new Promise(resolve => {
					const done = () => {
						audio.removeEventListener('ended', done);
						audio.removeEventListener('error', done);
						resolve();
					};
					audio.addEventListener('ended', done);
					audio.addEventListener('error', done);
					if (audio.error) audio.load();
					audio.currentTime = 0;
					audio.play().catch(done);
				});
			}

			function createQueue(run) {
				const items = [];
				let draining = false;
				const drain = async () => {
					if (draining) return;
					draining = true;
					while (items.length) {
						await run(items.shift());
					}
					draining = false;
				};
				return item => {
					items.push(item);
					drain();
				};
			}

			const enqueue = createQueue(playSound);
			const enqueueVisual = createQueue(showVisual);

			function compile(pattern) {
				try {
					return new RegExp(pattern, 'i');
				} catch (err) {
					console.error('invalid pattern', pattern, err);
					notify('Invalid pattern: ' + pattern);
					return null;
				}
			}

			function parse(line) {
				let rest = line;
				if (rest.startsWith('@')) rest = rest.slice(rest.indexOf(' ') + 1);
				if (rest.startsWith(':')) rest = rest.slice(rest.indexOf(' ') + 1);
				const split = rest.indexOf(' :');
				const head = split >= 0 ? rest.slice(0, split) : rest;
				return {
					command: head.split(' ')[0],
					trailing: split >= 0 ? rest.slice(split + 2) : '',
				};
			}

			function connect(channel, onJoin, onMessage) {
				let attempts = 0;

				const open = () => {
					notify('Connecting to #' + channel + '...');
					const ws = new WebSocket(IRC_URL);
					let lastSeen = Date.now();
					let dropped = false;

					const drop = () => {
						if (dropped) return;
						dropped = true;
						clearInterval(keepalive);
						ws.close();
						const wait = backoff(attempts++);
						notify('Disconnected from chat, reconnecting in ' + wait / 1000 + 's');
						setTimeout(open, wait);
					};

					const keepalive = setInterval(() => {
						if (Date.now() - lastSeen > 2 * PING_INTERVAL) return drop();
						if (ws.readyState === WebSocket.OPEN) ws.send('PING :tinyrewards');
					}, PING_INTERVAL);

					ws.onopen = () => {
						ws.send('CAP REQ :twitch.tv/commands');
						ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 90000));
						ws.send('JOIN #' + channel);
					};

					ws.onmessage = event => {
						lastSeen = Date.now();
						for (const line of event.data.split('\r\n')) {
							if (!line) continue;
							const msg = parse(line);
							switch (msg.command) {
								case 'PING':
									ws.send('PONG :' + msg.trailing);
									break;
								case 'RECONNECT':
									drop();
									return;
								case '001':
									attempts = 0;
									break;
								case 'JOIN':
									notify('Joined #' + channel);
									onJoin();
									break;
								case 'PRIVMSG':
									onMessage(msg.trailing);
									break;
							}
						}
					};

					ws.onclose = drop;
					ws.onerror = drop;
				};

				open();
			}

			function listen(onConnected, onRedemption) {
				const url = new URL(root + '/rewards/events', location.href);
				url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
				url.searchParams.set('user_id', userId);
				let attempts = 0;

				const open = () => {
					notify('Connecting to channel points...');
					const ws = new WebSocket(url);
					let lastSeen = Date.now();
					let dropped = false;

					const drop = () => {
						if (dropped) return;
						dropped = true;
						clearInterval(watchdog);
						ws.close();
						const wait = backoff(attempts++);
						notify('Disconnected from channel points, reconnecting in ' + wait / 1000 + 's');
						setTimeout(open, wait);
					};

					const watchdog = setInterval(() => {
						if (Date.now() - lastSeen > EVENTS_TIMEOUT) drop();
					}, EVENTS_TIMEOUT / 3);

					ws.onmessage = event => {
						lastSeen = Date.now();
						let msg;
						try {
							msg = JSON.parse(event.data);
						} catch (err) {
							console.error('invalid event', event.data, err);
							return;
						}
						switch (msg.type) {
							case 'connected':
								attempts = 0;
								notify('Listening to channel points');
								onConnected();
								break;
							case 'error':
								notify('Channel points: ' + msg.message);
								break;
							case 'redemption':
								onRedemption(msg.redemption, msg);
								break;
						}
					};

					ws.onclose = drop;
					ws.onerror = drop;
				};

				open();
			}

			function startRedemptions(pointRewards) {
				return new Promise(resolve => {
					listen(() => resolve(true), (redemption, msg) => {
						const reward = pointRewards.get(redemption.reward_id);
						if (!reward) return;
						if (reward.action === 'anonupload') {
							if (Array.isArray(msg.media) && msg.media.length) msg.media.forEach(item => enqueueVisual({ media: item }));
							else console.error('no media for redemption', redemption);
							return;
						}
						if (reward.action === 'twitch_clip') {
							if (msg.clip) enqueueVisual({ clip: msg.clip });
							else console.error('no clip for redemption', redemption);
							return;
						}
						if (reward.action === 'youtube') {
							if (msg.youtube) enqueueVisual({ youtube: msg.youtube });
							else console.error('no youtube video for redemption', redemption);
							return;
						}
						enqueue(reward.audio);
					});
				});
			}

			async function start() {
				notify('Loading rewards...');
				const { rewards } = await api('/users/' + encodeURIComponent(userId), 'rewards');
				notify('Loaded ' + plural(rewards.length, 'reward'));

				const patterns = [];
				const emoteRewards = new Map();
				const pointRewards = new Map();
				for (const reward of rewards) {
					if (reward.action && reward.action !== 'sound') {
						if (reward.type === 'twitch_channel_point_reward') pointRewards.set(reward.data, { action: reward.action });
						continue;
					}
					if (!reward.upload) continue;
					const audio = player(reward.upload.files);
					if (!audio) continue;
					if (reward.type === 'chat') {
						const regex = compile(reward.data);
						if (regex) patterns.push({ regex, audio });
					} else if (reward.type === 'chat_emote') {
						emoteRewards.set(reward.data, audio);
					} else if (reward.type === 'twitch_channel_point_reward') {
						pointRewards.set(reward.data, { action: 'sound', audio });
					}
				}

				notify('Loading ' + plural(loading.length, 'sound') + '...');
				const soundsLoaded = Promise.all(loading).then(results => {
					const failed = results.filter(ok => !ok).length;
					notify('Loaded ' + plural(results.length - failed, 'sound') + (failed ? ', ' + failed + ' failed' : ''));
					return true;
				});

				const sources = [];
				if (patterns.length || emoteRewards.size) sources.push(startChat(patterns, emoteRewards));
				if (pointRewards.size) sources.push(startRedemptions(pointRewards));
				if (!sources.length) {
					notify('No rewards found');
					return;
				}

				const results = await Promise.all([soundsLoaded, ...sources]);
				if (results.every(Boolean)) ready();
			}

			async function startChat(patterns, emoteRewards) {
				notify('Loading emotes...');
				const chat = await api('/widget/' + encodeURIComponent(userId), 'emotes');
				const emotes = new Map();
				for (const emote of chat.emotes) {
					if (!emotes.has(emote.name)) emotes.set(emote.name, emote.provider + ':' + emote.id);
				}
				notify('Loaded ' + plural(emotes.size, 'emote'));

				if (!chat.channel) {
					notify('No Twitch channel linked');
					return false;
				}

				let lastPlayed = -Infinity;

				await new Promise(resolve => {
					connect(chat.channel.toLowerCase(), resolve, raw => {
						const action = /^\x01ACTION (.*)\x01$/s.exec(raw);
						const text = (action ? action[1] : raw).replace(/\u{E0000}/gu, '');
						const sounds = [];

						for (const { regex, audio } of patterns) {
							const match = regex.exec(text);
							if (match) sounds.push({ index: match.index, audio });
						}

						for (const word of text.matchAll(/\S+/g)) {
							const key = emotes.get(word[0]);
							const audio = key && emoteRewards.get(key);
							if (audio) sounds.push({ index: word.index, audio });
						}

						const now = Date.now();
						if (!sounds.length || now - lastPlayed < delay) return;
						lastPlayed = now;
						sounds.sort((a, b) => a.index - b.index);
						if (emoteMode === 'once') sounds.length = 1;
						sounds.forEach(sound => enqueue(sound.audio));
					});
				});
				return true;
			}

			start().catch(err => {
				console.error(err);
				notify('Error: ' + err.message);
			});
		})();
	</script>
</body>

</html>
